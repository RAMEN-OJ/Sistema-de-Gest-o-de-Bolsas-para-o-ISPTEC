<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta · Bolsas ISPTEC</title>
<link rel="icon" href="img/logo.png">
<script src="js/tema.js"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header><div class="nav" id="nav"><a class="logo" href="index.html"><img src="img/logo.png" alt="ISPTEC"><span>Bolsas</span></a></div></header>
<main id="app"><div class="card auth"><h1>Criar conta</h1><p class="sub">Contas comuns apenas. Não existe opção de admin.</p>
<form id="form"><label for="nome">Nome</label><input id="nome" required>
<label for="email">Email</label><input id="email" type="email" required>
<label for="senha">Senha (mín. 4 caracteres)</label><input id="senha" type="password" minlength="4" required>
<label for="nasc">Data de nascimento</label><input id="nasc" type="date" required>
<button class="btn full" type="submit">Registar</button><div class="msg" id="msg" role="alert"></div></form>
<p class="mut" style="text-align:center"><a href="login.html">Voltar ao login</a></p></div></main>
<script src="js/dados.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/extras.js"></script>
<script src="js/reveal.js"></script>
<script src="js/cadastro.js"></script>
</body>
</html>
